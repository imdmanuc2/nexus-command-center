name: Nexus Development Container

on:
  push:
    branches:
      - feature/discovery-engine-v2
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-container.txt"
      - ".github/workflows/nexus-container-dev.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: imdmanuc2/nexus-command-center

jobs:
  build:
    name: Build Nexus container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nexus
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and publish Nexus
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXUS_VERSION=development
            NEXUS_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
